<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8ad25;--ink:#292416;--mu:#81795f;--bg:#faf7eb;--line:#eee5c8;--gr:linear-gradient(110deg,#d2a51c,#f0d45d 55%,#d8ad25);--sh:0 8px 28px rgba(108,85,19,.10);--gn:#27734c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid #8a6a0c;outline-offset:2px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 24px;min-height:72px;background:var(--gr);color:#30270e;box-shadow:0 3px 16px rgba(122,93,23,.15)}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0;font-weight:800;font-size:17px}
.brand small{display:block;font-size:10px;letter-spacing:1.5px;font-weight:700;opacity:.78}
.mark{width:44px;height:44px;border-radius:12px;overflow:hidden;border:2px solid rgba(255,255,255,.65);flex:none;background:#fff;box-shadow:0 3px 10px rgba(94,70,12,.18)}
.mark img,.mark svg{width:100%;height:100%;object-fit:cover;display:block}
.badge{border:1px solid rgba(255,255,255,.65);background:rgba(255,255,255,.35);padding:7px 11px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:.7px}
.badge.ad{background:#27633b;color:#fff;border-color:#27633b}
.layout{display:grid;grid-template-columns:235px 1fr;max-width:1560px;margin:0 auto}
aside{padding:22px 14px;border-right:1px solid var(--line);background:#fffdf6;min-height:calc(100vh - 72px)}
.nl{font-size:10px;color:#a09570;font-weight:800;letter-spacing:1.6px;padding:8px 12px}
aside nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:12px;border-radius:10px;color:#716849;text-align:left;margin:3px 0;font-weight:700;font-size:13.5px;white-space:nowrap}
aside nav button span{width:20px;text-align:center;font-size:16px}
aside nav button.on,aside nav button:hover{background:#f8edc5;color:#5b450a}
.note{margin:26px 4px 0;padding:14px;border-radius:13px;background:linear-gradient(145deg,#fff6d6,#fffdf5);border:1px solid #f0df9c;color:#75612b;font-size:12px;line-height:1.6}
main{padding:26px 28px 48px;min-width:0}
h2{font-size:16px;font-weight:800;margin:24px 0 12px}
.ph h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.6px}
.sub,.hint{color:var(--mu);font-size:13px}
.btn{border:0;border-radius:9px;padding:9px 14px;font-weight:700;background:var(--gold);color:#30270e;box-shadow:0 3px 9px rgba(177,138,40,.16);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(.96)}
.btn.o{background:#fff;border:1px solid var(--line);box-shadow:none;color:#5e512c}
.btn.x{background:#fae9e5;border:1px solid #e7beb5;box-shadow:none;color:#9e3c2d}
.btn.s{padding:6px 10px;font-size:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:var(--sh);min-width:0}
.st .stt{display:flex;justify-content:space-between;align-items:center;color:#8b805e;font-size:12px;font-weight:700}
.st .ic{background:#fbf1cc;border-radius:9px;width:32px;height:32px;display:grid;place-items:center;font-size:16px}
.st b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:8px;line-height:1.2}
.st small{color:#9a906f;font-size:11.5px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:480px}
th{background:#fcf8e9;color:#82764f;font-size:10.5px;letter-spacing:.8px;font-weight:800;padding:12px 13px;text-align:center}
td{padding:12px 13px;border-top:1px solid #f1ecd9;font-size:12.5px;text-align:center;white-space:nowrap}
td:nth-child(2),th:nth-child(2){text-align:left}
tr.lead{background:#fffdf2}
td:first-child{font-weight:900;color:#9a7918}
td.pts{font-weight:800}
.tl{display:inline-flex;align-items:center;gap:9px;font-weight:700;vertical-align:middle}
.tl i{width:30px;height:30px;border-radius:8px;background:#f8edc5;color:#7d6723;border:1px solid rgba(0,0,0,.06);font:800 11px/30px Inter;text-align:center;font-style:normal;overflow:hidden;flex:none}
.tl.lg i{width:56px;height:56px;line-height:56px;font-size:18px;border-radius:14px}
.mc{background:#fffdf9;border:1px solid var(--line);border-radius:13px;padding:14px 16px;margin-bottom:12px}
.meta{border-top:1px dashed #ece3c6;padding-top:10px;margin-top:12px;color:#827651;font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.vs .r{justify-self:end}
.vs .m{text-align:center;min-width:100px}
.sc{display:inline-block;font-size:19px;font-weight:900;background:#faf4df;padding:6px 14px;border-radius:10px;border:1px solid #eadfb9}
.pill{display:inline-block;margin-top:4px;padding:3px 8px;border-radius:20px;background:#f5efd9;color:#7d6723;font-size:10px;font-weight:800}
.pill.done{background:#e8f5ec;color:var(--gn)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1;min-width:110px}
.gt{display:inline-block;min-width:56px;padding:7px 9px;border:1px solid #eadfb9;background:#faf4df;border-radius:8px;font-weight:800;text-align:center}
.row>.btn{white-space:normal;line-height:1.25;text-align:center}
input,select,textarea{background:#fff;color:var(--ink);border:1px solid #e3d8b0;border-radius:8px;padding:7px 9px;width:100%}
input.n{width:60px;text-align:center}
td input,td select{min-width:70px}
td input.n{width:56px}
textarea{min-height:110px}
.empty{color:var(--mu);padding:20px;text-align:center}
.teams{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.teams ul{list-style:none;padding:0;margin:10px 0 0;color:var(--mu);font-size:13px}
.teams li{padding:5px 0;border-top:1px solid #f1ecd9}
#msg{position:fixed;left:12px;right:12px;top:12px;z-index:60;padding:12px 14px;border-radius:12px;display:flex;gap:10px;justify-content:space-between;align-items:center;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.2);max-width:560px;margin:0 auto}
#msg.ok{background:#e8f5ec;color:#1e5c35;border:1px solid #9fd3b2}#msg.er{background:#fae9e5;color:#9e3c2d;border:1px solid #e7beb5}#msg button{border:0;background:none;font-size:22px;line-height:1;color:inherit}
#dlg{position:fixed;inset:0;background:rgba(40,30,8,.5);z-index:50;display:grid;place-items:center;padding:16px}#dlg .card{width:100%;max-width:420px}
@media(max-width:960px){.layout{grid-template-columns:minmax(0,1fr)}.layout>*{min-width:0}aside{min-height:0;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}.nl,.note{display:none}aside nav{display:flex;gap:6px;overflow-x:auto}aside nav button{width:auto}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:18px 14px 40px}header{padding:10px 14px}}
@media(max-width:600px){.vs{gap:8px}.vs .m{min-width:70px}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="imp" accept="application/json" hidden>
<script>
// ---- Settings: change this password before publishing. Note: it is visible in the page source (casual protection only).
const ADMIN_PASS='admin123';
// How many upcoming matches to show on the Overview page.
const NEXT_MATCHES=2;
const KEY='u9tournament';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
let S,admin=sessionStorage.getItem('u9admin')==='1',tab='overview',pf='';

function def(){
  const t=['U9 Lions','U9 Eagles','U9 Tigers','U9 Wolves'].map((n,i)=>({id:'t'+i,name:n,logo:''}));
  const p=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
  return{name:'U9 Gold Cup',logo:'',teams:t,players:[],
    matches:p.map((x,i)=>({id:'m'+i,round:Math.floor(i/2)+1,h:t[x[0]].id,a:t[x[1]].id,date:'',time:'',venue:i%2?'Field 2':'Main Stadium',hs:'',as:''}))};
}
async function init(){
  let d=null;
  try{const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r.ok)d=await r.json()}catch(e){}
  let ls=null;try{ls=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  S=(admin&&ls)||d||ls||def();
  render();
}
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}

const T=id=>S.teams.find(t=>t.id===id)||{id:'',name:'TBD',logo:''};
const played=m=>m.hs!==''&&m.as!==''&&m.hs!=null&&m.as!=null;
const ini=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
const tl=(t,lg)=>`<span class="tl${lg?' lg':''}"><i>${t.logo?`<img src="${t.logo}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc(ini(t.name))}</i>${lg?'':esc(t.name)}</span>`;
const mark=()=>S.logo?`<div class="mark"><img src="${S.logo}" alt=""></div>`:`<div class="mark"><svg viewBox="0 0 128 128" role="img" aria-label="Logo"><defs><radialGradient id="gb" cx="28%" cy="22%" r="85%"><stop offset="0" stop-color="#f7e28a"/><stop offset=".45" stop-color="#dfb228"/><stop offset="1" stop-color="#ab7f10"/></radialGradient></defs><rect width="128" height="128" fill="url(#gb)"/><path d="M29 43v25c0 15.5 10.5 25.5 23.5 25.5S76 83.5 76 68V51c0-10.5 8-18 18.5-18S113 40.5 113 51s-8 18-18.5 18c-6.5 0-12-3-15.5-7.8" fill="none" stroke="#fff" stroke-width="15.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M110.2 58.5L90.5 93.5" fill="none" stroke="#fff" stroke-width="15.5" stroke-linecap="round"/></svg></div>`;
const inp=(c,v,type='text',cls='')=>`<input data-c="${c}" type="${type}" value="${esc(v)}" class="${cls}"${type==='number'?' min="0"':''}>`;
const sel=(c,v)=>`<select data-c="${c}">${S.teams.map(t=>`<option value="${t.id}"${t.id===v?' selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
const fd=d=>d?new Date(d+'T00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'}):'Date to be set';

function table(){
  const r=S.teams.map(t=>({t,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));
  S.matches.forEach(m=>{
    if(!played(m))return;
    const a=r.find(x=>x.t.id===m.h),b=r.find(x=>x.t.id===m.a);if(!a||!b)return;
    const h=+m.hs,g=+m.as;a.p++;b.p++;a.gf+=h;a.ga+=g;b.gf+=g;b.ga+=h;
    if(h>g){a.w++;a.pts+=3;b.l++}else if(h<g){b.w++;b.pts+=3;a.l++}else{a.d++;b.d++;a.pts++;b.pts++}
  });
  return r.sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf);
}
const tableHtml=(rows,full)=>`<div class="wrap"><table><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th>${full?'<th>GF</th><th>GA</th>':''}<th>GD</th><th>Pts</th></tr>${rows.map((x,i)=>`<tr${i===0&&x.p?' class="lead"':''}><td>${i+1}</td><td>${tl(x.t)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td>${full?`<td>${x.gf}</td><td>${x.ga}</td>`:''}<td>${x.gf-x.ga>0?'+':''}${x.gf-x.ga}</td><td class="pts">${x.pts}</td></tr>`).join('')}</table></div>`;

const tg=p=>S.matches.reduce((n,m)=>n+(m.sc||[]).filter(x=>x.p===p.id).length,0);
const gview=m=>{const g=(m.sc||[]).map(x=>({x,p:S.players.find(p=>p.id===x.p)})).filter(o=>o.p);if(!g.length)return'';const li=h=>g.filter(o=>(o.p.t===m.h)===h).map(o=>`<div>⚽ ${esc(o.p.name)}${o.x.min?' '+esc(o.x.min)+"'":''}</div>`).join('');return`<div class="vs" style="margin-top:10px;font-size:12px;color:#5e512c"><div>${li(true)}</div><div></div><div style="text-align:right">${li(false)}</div></div>`};
const gedit=m=>{const ps=S.players.filter(p=>p.t===m.h||p.t===m.a),sc=m.sc||[];return`<div style="border-top:1px dashed #ece3c6;padding-top:10px;margin-top:4px"><div class="hint" style="margin-bottom:6px">⚽ Goal scorers (${sc.length} of ${(+m.hs||0)+(+m.as||0)} goals listed)</div>${sc.map((x,i)=>`<div class="row c"><select data-g="${m.id}|${i}|p">${ps.map(p=>`<option value="${p.id}"${p.id===x.p?' selected':''}>${esc(p.name)} (${esc(T(p.t).name)})</option>`).join('')}</select><input data-g="${m.id}|${i}|min" value="${esc(x.min)}" placeholder="Minute" class="n" style="flex:0"><button class="btn x s" data-a="delg" data-id="${m.id}" data-i="${i}" style="flex:0">Remove</button></div>`).join('')}<button class="btn o s" data-a="addg" data-id="${m.id}">Add goal scorer</button></div>`};
function matchCard(m,v){
  if(admin&&!v)return`<div class="mc"><div class="row c">${inp(`matches|${m.id}|round`,m.round,'number','n')}${inp(`matches|${m.id}|date`,m.date,'date')}${inp(`matches|${m.id}|time`,m.time,'time')}<input data-c="matches|${m.id}|venue" value="${esc(m.venue)}" placeholder="Stadium name"></div>
  <div class="row c">${sel(`matches|${m.id}|h`,m.h)}${inp(`matches|${m.id}|hs`,m.hs,'number','n')}<span style="flex:0;min-width:0">-</span>${inp(`matches|${m.id}|as`,m.as,'number','n')}${sel(`matches|${m.id}|a`,m.a)}<button class="btn x s" data-a="delm" data-id="${m.id}" style="flex:0">Delete</button></div>${gedit(m)}</div>`;
  const h=T(m.h),a=T(m.a),p=played(m);
  return`<div class="mc"><div class="vs">${tl(h)}<div class="m"><span class="sc">${p?m.hs+' - '+m.as:'vs'}</span><br><span class="pill${p?' done':''}">${p?'Full time':'Upcoming'}</span></div><span class="r">${tl(a)}</span></div>${gview(m)}<div class="meta"><span>📅 ${fd(m.date)}${m.time?', '+esc(m.time):''}</span><span>📍 ${esc(m.venue||'Venue to be set')}</span></div></div>`;
}

const views={
overview(){
  const tb=table(),pl=S.matches.filter(played),g=pl.reduce((s,m)=>s+ +m.hs+ +m.as,0);
  const top=[...S.players].sort((a,b)=>tg(b)-tg(a))[0],next=S.matches.filter(m=>!played(m)).slice(0,NEXT_MATCHES),last=pl[pl.length-1];
  const st=(l,v,f,i)=>`<div class="card st"><div class="stt"><span>${l}</span><span class="ic">${i}</span></div><b>${v}</b><small>${f}</small></div>`;
  return`<div class="ph"><h1>${esc(S.name)}</h1><div class="sub">${S.teams.length} teams, everyone plays everyone once</div></div>
  <div class="grid">${st('Matches played',pl.length+' of '+S.matches.length,'Round-robin league','📅')}${st('Goals scored',g,pl.length?(g/pl.length).toFixed(1)+' per match':'No matches played','⚽')}${st('Leading team',pl.length?esc(tb[0].t.name):'Not started',pl.length?tb[0].pts+' points':'Waiting for first result','🏆')}${st('Top scorer',top&&tg(top)?esc(top.name):'None yet',top&&tg(top)?tg(top)+' goals':'Add player stats','👟')}</div>
  <h2>Standing</h2>${tableHtml(tb,false)}
  <h2>Next and latest</h2>${next.length?'<div class="hint">Next '+(next.length>1?'matches':'match')+'</div>'+next.map(m=>matchCard(m,1)).join(''):''}${last?'<div class="hint">Latest result</div>'+matchCard(last,1):''}${!next.length&&!last?'<div class="empty">No matches yet.</div>':''}
  ${admin?`<h2>Admin tools</h2><div class="card"><div class="row c"><input data-c="root||name" value="${esc(S.name)}" placeholder="Tournament name"><label class="btn o s" style="text-align:center">Upload logo<input type="file" accept="image/*" data-logo="main" hidden></label>${S.logo?'<button class="btn o s" data-a="rmlogo" data-id="main">Remove logo</button>':''}</div>
  <div class="row"><button class="btn" data-a="publish">☁️ Publish to GitHub</button><button class="btn o" data-a="ghset">GitHub settings</button><button class="btn o" data-a="export">Export data.json</button><button class="btn o" data-a="import">Import data.json</button><button class="btn x" data-a="reset">Reset all</button></div>
  <p class="hint">Edits are saved in this browser as you type. Tap Publish to GitHub to save them to your repository as data.json so every viewer sees them. Export data.json is a manual backup.</p></div>`:''}`;
},
standings(){return`<h2>Standing</h2>${tableHtml(table(),true)}<p class="hint">Ranked by points, then goal difference, then goals scored. Win 3, draw 1, loss 0.</p>`},
fixtures(){
  const rs=[...new Set(S.matches.map(m=>+m.round||1))].sort((a,b)=>a-b);
  return`<h2>Fixtures</h2>${admin?'<p><button class="btn" data-a="addm">Add match</button></p>':''}${rs.length?rs.map(r=>`<div class="hint" style="margin:14px 0 6px">Round ${r}</div>${S.matches.filter(m=>(+m.round||1)===r).map(m=>matchCard(m)).join('')}`).join(''):'<div class="empty">No matches yet.</div>'}`;
},
players(){
  const ps=S.players.filter(p=>!pf||p.t===pf).sort((a,b)=>tg(b)-tg(a)||b.a-a.a||a.name.localeCompare(b.name));
  const filt=`<select id="pf" style="max-width:220px"><option value="">All teams</option>${S.teams.map(t=>`<option value="${t.id}"${t.id===pf?' selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
  const rows=ps.map(p=>admin?`<tr><td>${inp(`players|${p.id}|no`,p.no,'text','n')}</td><td>${inp(`players|${p.id}|name`,p.name)}</td><td>${sel(`players|${p.id}|t`,p.t)}</td><td>${inp(`players|${p.id}|pos`,p.pos,'text','n')}</td><td><span class="gt">${tg(p)}</span></td>${['a','y','r'].map(k=>`<td>${inp(`players|${p.id}|${k}`,p[k],'number','n')}</td>`).join('')}<td><button class="btn x s" data-a="delp" data-id="${p.id}">Delete</button></td></tr>`
    :`<tr><td>${esc(p.no)}</td><td>${esc(p.name)}</td><td>${tl(T(p.t))}</td><td>${esc(p.pos)}</td><td class="pts">${tg(p)}</td><td>${p.a}</td><td>${p.y}</td><td>${p.r}</td></tr>`).join('');
  return`<h2>Players statistics</h2>${admin?'<p class="hint">The Goals column is counted automatically from the goal scorers you add in Fixtures. Use Extra only for goals that are not listed in a fixture.</p>':''}<div class="row c">${filt}${admin?'<button class="btn" data-a="addp" style="flex:0;white-space:nowrap">Add player</button>':''}</div>
  <div class="wrap"><table><tr><th>No</th><th>Player</th><th>Team</th><th>Pos</th><th>Goals</th><th>Assists</th><th>Yellow</th><th>Red</th>${admin?'<th></th>':''}</tr>${rows||`<tr><td colspan="10" class="empty">No players yet.</td></tr>`}</table></div>
  ${admin?`<h2>Bulk add players</h2><div class="card"><p class="hint">One player per line: Name, Number, Position, Team, Goals, Assists. Only the name is required. If the team is missing or does not match, the team below is used.</p>
  <div class="row"><select id="bteam">${S.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
  <textarea id="bt" placeholder="Ali Khan, 9, FW&#10;Sam Lee, 1, GK, U9 Eagles&#10;Jon Tan, 7, MF, U9 Lions, 2, 1"></textarea><p><button class="btn" data-a="bulk">Add players</button></p></div>`:''}`;
},
teams(){
  return`<h2>Teams</h2><div class="teams">${S.teams.map(t=>{const ps=S.players.filter(p=>p.t===t.id).sort((a,b)=>(+a.no||99)-(+b.no||99));
    return`<div class="card"><div class="row c" style="flex-wrap:nowrap">${tl(t,true)}${admin?`<input data-c="teams|${t.id}|name" value="${esc(t.name)}">`:`<b>${esc(t.name)}</b>`}</div>
    ${admin?`<div class="row"><label class="btn o s" style="text-align:center">Upload logo<input type="file" accept="image/*" data-logo="${t.id}" hidden></label>${t.logo?`<button class="btn o s" data-a="rmlogo" data-id="${t.id}">Remove logo</button>`:''}</div>`:''}
    <ul>${ps.length?ps.map(p=>`<li>${esc(p.no?'#'+p.no+' ':'')}${esc(p.name)} <span style="float:right">${esc(p.pos)}</span></li>`).join(''):'<li>No players yet</li>'}</ul></div>`}).join('')}</div>`;
}};

const tabs=[['overview','Overview'],['standings','Standing'],['fixtures','Fixtures'],['players','Players statistics'],['teams','Teams']];
function render(){
  document.title=S.name;
  const ic={overview:'▦',standings:'🏆',fixtures:'📅',players:'⚽',teams:'🛡️'};
  $('#app').innerHTML=`<header><div class="brand">${mark()}<div><span>${esc(S.name)}</span><small>${S.teams.length}-TEAM ROUND-ROBIN TOURNAMENT</small></div></div><span class="badge${admin?' ad':''}">${admin?'ADMIN MODE':'VIEWER MODE'}</span>${admin?'<button class="btn s" data-a="publish">☁️ Publish to GitHub</button>':''}<button class="btn s${admin?'':' o'}" data-a="${admin?'logout':'login'}">${admin?'🔒 Log out':'🔓 Admin login'}</button></header>
  <div class="layout"><aside><div class="nl">TOURNAMENT MENU</div><nav>${tabs.map(t=>`<button data-a="tab" data-id="${t[0]}" class="${tab===t[0]?'on':''}"><span>${ic[t[0]]}</span>${t[1]}</button>`).join('')}</nav><div class="note"><b>Tournament format</b><br>• ${S.teams.length} participating teams<br>• Single round-robin league<br>• ${S.matches.length} matches in total</div></aside><main>${views[tab]()}</main></div>`;
}

function msg(t,ok){let b=$('#msg');if(!b){b=document.createElement('div');b.id='msg';document.body.appendChild(b)}b.className=ok?'ok':'er';b.innerHTML=`<span>${esc(t)}</span><button onclick="this.parentNode.remove()" aria-label="Close">×</button>`}
function getGh(){try{return JSON.parse(localStorage.getItem('u9gh'))||{}}catch(e){return{}}}
function publish(){const g=getGh();if(g.token&&g.owner&&g.repo)push(g);else ghForm()}
function ghForm(){
  const g=getGh(),h=location.hostname,o=g.owner||(h.endsWith('github.io')?h.split('.')[0]:''),p=location.pathname.split('/')[1],rp=g.repo||(p&&!p.includes('.')?p:(o?o+'.github.io':''));
  const d=document.createElement('div');d.id='dlg';
  d.innerHTML=`<div class="card"><h2 style="margin-top:0">Connect to GitHub</h2><div class="row"><input id="gu" placeholder="GitHub username" value="${esc(o)}"><input id="gr" placeholder="Repository name" value="${esc(rp)}"></div><div class="row"><input id="gt" type="password" placeholder="Token (github_pat_...)" value="${esc(g.token||'')}"></div><div class="row"><button class="btn" id="gs">Save and publish</button><button class="btn o" id="gc">Cancel</button></div></div>`;
  document.body.appendChild(d);
  $('#gc').onclick=()=>d.remove();
  $('#gs').onclick=()=>{const n={owner:$('#gu').value.trim(),repo:$('#gr').value.trim(),token:$('#gt').value.trim()};if(!n.owner||!n.repo||!n.token){msg('Fill in the username, repository name and token.',0);return}d.remove();push(n)};
}
async function push(g){
  msg('Publishing to GitHub...',1);
  const u=`https://api.github.com/repos/${g.owner}/${g.repo}/contents/data.json`,hd={Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'};
  try{
    const r0=await fetch(u,{headers:hd,cache:'no-store'});
    if(r0.status===401){msg('GitHub rejected the token. It may be wrong or expired. Tap GitHub settings to enter a new one.',0);return}
    const body={message:'Update tournament data',content:btoa(unescape(encodeURIComponent(JSON.stringify(S,null,1))))};
    if(r0.ok)body.sha=(await r0.json()).sha;
    const r1=await fetch(u,{method:'PUT',headers:hd,body:JSON.stringify(body)});
    if(r1.ok){localStorage.setItem('u9gh',JSON.stringify(g));msg('Saved to GitHub as data.json. Viewers will see it in a minute or two.',1)}
    else{const e=await r1.json().catch(()=>({}));msg('Publish failed ('+r1.status+'): '+(e.message||'unknown error')+(r1.status===404?'. Check the username and repository name, and that the token has access to this repository.':r1.status===403?'. The token needs Contents: Read and write permission.':'')+' Tap GitHub settings to fix it.',0)}
  }catch(e){msg('Could not reach GitHub. Check your internet connection and try again.',0)}
}

function img(f,cb){
  if(!f)return;const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,200/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};i.src=r.result};
  r.readAsDataURL(f);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab'){tab=id;render();return}
  if(a==='login'){const p=prompt('Admin password');if(p===ADMIN_PASS){admin=true;sessionStorage.setItem('u9admin','1');let ls=null;try{ls=JSON.parse(localStorage.getItem(KEY))}catch(x){}if(ls)S=ls;render()}else if(p!==null)alert('Wrong password.');return}
  if(a==='logout'){sessionStorage.removeItem('u9admin');location.reload();return}
  if(!admin)return;
  if(a==='publish'){publish();return}
  if(a==='ghset'){ghForm();return}
  if(a==='addm'){S.matches.push({id:uid(),round:Math.max(1,...S.matches.map(m=>+m.round||1)),h:S.teams[0].id,a:S.teams[1].id,date:'',time:'',venue:'',hs:'',as:''});save()}
  if(a==='addg'){const m=S.matches.find(x=>x.id===id),p=S.players.find(x=>x.t===m.h||x.t===m.a);if(!p){alert('Add players to these teams first.');return}(m.sc=m.sc||[]).push({p:p.id,min:''});save()}
  if(a==='delg'){S.matches.find(x=>x.id===id).sc.splice(+b.dataset.i,1);save()}
  if(a==='delm'&&confirm('Delete this match?')){S.matches=S.matches.filter(m=>m.id!==id);save()}
  if(a==='addp'){S.players.push({id:uid(),t:pf||S.teams[0].id,name:'New player',no:'',pos:'',g:0,a:0,y:0,r:0});save()}
  if(a==='delp'&&confirm('Delete this player?')){S.players=S.players.filter(p=>p.id!==id);S.matches.forEach(m=>m.sc=(m.sc||[]).filter(x=>x.p!==id));save()}
  if(a==='rmlogo'){if(id==='main')S.logo='';else T(id).logo='';save()}
  if(a==='bulk'){
    const tm=$('#bteam').value;
    $('#bt').value.split('\n').forEach(l=>{const p=l.split(/[,\t]/).map(x=>x.trim());if(!p[0])return;
      const t=S.teams.find(x=>x.name.toLowerCase()===(p[3]||'').toLowerCase());
      S.players.push({id:uid(),t:t?t.id:tm,name:p[0],no:p[1]||'',pos:p[2]||'',g:+p[4]||0,a:+p[5]||0,y:0,r:0})});
    save();
  }
  if(a==='export'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));l.download='data.json';l.click()}
  if(a==='import')$('#imp').click();
  if(a==='reset'&&confirm('Reset everything to the default tournament?')){S=def();save()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='pf'){pf=el.value;render();return}
  if(!admin)return;
  if(el.dataset.logo){const id=el.dataset.logo;img(el.files[0],d=>{if(id==='main')S.logo=d;else T(id).logo=d;save()});return}
  if(el.id==='imp'){const f=el.files[0];if(f)f.text().then(t=>{try{S=JSON.parse(t);save()}catch(x){alert('That file is not a valid data.json.')}});return}
  if(el.dataset.g){const[mi,i,f]=el.dataset.g.split('|');S.matches.find(x=>x.id===mi).sc[+i][f]=el.value;save();return}
  const c=el.dataset.c;if(!c)return;
  const[k,id,f]=c.split('|');let v=el.value;
  if(el.type==='number')v=v===''?'':Math.max(0,+v);
  if(k==='root')S[f]=v;else{const o=S[k].find(x=>x.id===id);if(o)o[f]=v}
  save();
});
init();
</script>
</body>
